<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ product.name }} - Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container detail-container">
    <a href="index.html" class="back-link">← Back to catalog</a>
    <div class="detail-card">
        {% if product.image_url %}
            <img src="{{ product.image_url }}" alt="{{ product.name }}" class="detail-image">
        {% else %}
            <div class="detail-image-placeholder">No image available</div>
        {% endif %}
        <h1>{{ product.name }}</h1>
        <div class="detail-price">Price: {{ product.price }}</div>
        <div class="detail-date">Release: {{ product.release_date }}</div>
        <p class="detail-description">Game extracted from Steam via scraping.</p>
        <div class="detail-action"><span class="info-message">Catalog mode - No cart</span></div>
    </div>
    <footer>Original data from Steam</footer>
</div>
</body>
</html>
